name: 'Agentic Flow'
description: 'Autonomous issue investigation and fix agent'
inputs:
  anthropic-api-key:
    required: true
  github-token:
    required: true
  issue-number:
    required: true
  event:
    required: false
    default: 'issue_opened'
  comment-body:
    required: false
    default: ''
  comment-author:
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - name: Install Playwright browser
      run: python -m playwright install --with-deps chromium
      shell: bash

    - name: Run agentic-flow
      run: |
        python ${{ github.action_path }}/main.py --event "${{ inputs.event }}" --issue-number "${{ inputs.issue-number }}" --comment-body "${{ inputs.comment-body }}" --comment-author "${{ inputs.comment-author }}"
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPO: ${{ github.repository }}