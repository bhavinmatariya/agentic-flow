name: 'Agentic Flow'
description: 'Autonomous issue investigation and fix agent'
inputs:
  anthropic-api-key:
    required: true
  github-token:
    required: true
  issue-number:
    required: true
  event:
    required: false
    default: 'issue_opened'
  comment-body:
    required: false
    default: ''
  comment-author:
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Skip bot echo comments (fast exit)
      if: >
        inputs.event == 'issue_comment' &&
        (contains(inputs.comment-body, 'agentic-flow:auto') ||
         inputs.comment-author == 'github-actions[bot]')
      run: |
        echo "Skipping agentic-flow: triggered by the agent's own comment (anti-loop)."
        exit 0
      shell: bash

    - uses: actions/setup-python@v5
      if: >
        inputs.event != 'issue_comment' ||
        (!contains(inputs.comment-body, 'agentic-flow:auto') &&
         inputs.comment-author != 'github-actions[bot]')
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      if: >
        inputs.event != 'issue_comment' ||
        (!contains(inputs.comment-body, 'agentic-flow:auto') &&
         inputs.comment-author != 'github-actions[bot]')
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - name: Install Playwright browser
      if: >
        inputs.event != 'issue_comment' ||
        (!contains(inputs.comment-body, 'agentic-flow:auto') &&
         inputs.comment-author != 'github-actions[bot]')
      run: python -m playwright install --with-deps chromium
      shell: bash

    - name: Run agentic-flow
      if: >
        inputs.event != 'issue_comment' ||
        (!contains(inputs.comment-body, 'agentic-flow:auto') &&
         inputs.comment-author != 'github-actions[bot]')
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPO: ${{ github.repository }}
        COMMENT_BODY: ${{ inputs.comment-body }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        EVENT_NAME: ${{ inputs.event }}
        COMMENT_AUTHOR: ${{ inputs.comment-author }}
      run: |
        python "${{ github.action_path }}/main.py" \
          --event "$EVENT_NAME" \
          --issue-number "$ISSUE_NUMBER" \
          --comment-body "$COMMENT_BODY" \
          --comment-author "$COMMENT_AUTHOR"
      shell: bash